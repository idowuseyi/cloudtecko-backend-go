# gitleaks configuration.
#
# Purpose: keep the scan meaningful. Without an allowlist every run reports the
# same 17 test fixtures, and a report that is always red is a report nobody reads
# -- which is how a real credential gets missed.
#
# Everything allowlisted below is a deterministic test fixture that MUST stay
# committed for the suite to work. Nothing here grants access to anything.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
regexTarget = "match"
paths = [
    # Static test users, access/refresh tokens and argon2id hashes for the
    # integresql test database.
    '''internal/test/fixtures/fixtures\.go''',
    # Every _test.go file: table-driven cases embed the fixture tokens above.
    '''.*_test\.go$''',
    # SQL dumps used by the migration tests.
    '''test/testdata/.*\.sql$''',
]

[allowlist]
description = "Repository-wide allowlist"
paths = [
    # Documented dev-only defaults (dbuser/dbpass, mgmtpass). These are the
    # credentials of a throwaway local container; they are intentionally visible
    # so a new contributor can start the stack.
    '''docker-compose\.yml''',
    '''\.github/workflows/docker\.env''',
    # Keys only, never values -- enforced in review.
    '''\.env\.local\.sample''',
    # Changelog / docs may quote example values.
    '''docs/.*\.md$''',
]
