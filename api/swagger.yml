                    - accepted
                    - expired
    membershipApplicationList:
        type: object
        required:
            - items
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/membershipApplication'
    orderDir:
        type: string
        enum:
            - asc
            - desc
    postAcceptInvitationPayload:
        description: |-
            Accepts an invitation by choosing a password. The account is created HERE,
            not at approval time, so an unaccepted invitation leaves no orphan account
            and the link alone grants nothing.
        type: object
        required:
            - password
        properties:
            password:
                type: string
                maxLength: 512
                minLength: 15
                example: a-sufficiently-long-passphrase
    postApplicationReviewPayload:
        type: object
        properties:
            note:
                type: string
                maxLength: 1000
    postCategoryPayload:
        type: object
        required:
            - scope
            - slug
            - name
        properties:
            name:
                type: string
                maxLength: 120
                minLength: 1
            scope:
                type: string
                enum:
                    - event
                    - resource
            slug:
                type: string
                maxLength: 80
                minLength: 1
                pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                example: workshop
            sortOrder:
                type: integer
                default: 0
                minimum: 0
    postChangePasswordPayload:
        type: object
        required:
            - currentPassword
            - newPassword
        properties:
            currentPassword:
                description: Current password of user
                type: string
                maxLength: 500
                minLength: 1
                example: correct horse battery staple
            newPassword:
                description: New password to set for user
                type: string
                maxLength: 500
                minLength: 15
                example: correct horse battery staple
    postCheckoutPayload:
        type: object
        required:
            - lines
            - email
            - fullName
            - shippingState
        properties:
            email:
                type: string
                format: email
                maxLength: 255
            fullName:
                type: string
                maxLength: 200
                minLength: 1
            lines:
