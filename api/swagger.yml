            summary:
                type: string
            title:
                type: string
    ticketTier:
        type: object
        required:
            - id
            - name
            - priceKobo
            - currency
            - remaining
            - maxPerOrder
        properties:
            currency:
                type: string
            description:
                type: string
            id:
                type: string
                format: uuid4
            maxPerOrder:
                description: Zero means unlimited per order.
                type: integer
            name:
                type: string
                example: General Admission
            priceKobo:
