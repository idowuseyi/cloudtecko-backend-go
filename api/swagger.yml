                  schema:
                    $ref: '#/definitions/postForgotPasswordCompletePayload'
            responses:
                "200":
                    description: PostLoginResponse
                    schema:
                        $ref: '#/definitions/postLoginResponse'
                "400":
                    description: PublicHTTPValidationError, type `INVALID_PASSWORD`
                    schema:
                        $ref: '#/definitions/publicHttpValidationError'
                "403":
                    description: PublicHTTPError, type `USER_DEACTIVATED`/`NOT_LOCAL_USER`
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "404":
                    description: PublicHTTPError, type `TOKEN_NOT_FOUND`
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "409":
                    description: PublicHTTPError, type `TOKEN_EXPIRED`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/auth/login:
        post:
            description: Returns an access and refresh token on successful authentication
            tags:
                - auth
            summary: Login with local user
            operationId: PostLoginRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postLoginPayload'
            responses:
                "200":
                    description: PostLoginResponse
                    schema:
                        $ref: '#/definitions/postLoginResponse'
                "400":
                    description: PublicHTTPValidationError
                    schema:
                        $ref: '#/definitions/publicHttpValidationError'
                "401":
                    description: PublicHTTPError
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "403":
                    description: PublicHTTPError, type `USER_DEACTIVATED`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/auth/logout:
        post:
            description: |-
                Logs the local user out, destroying the provided access token.
                A refresh token can optionally be provided, destroying it as well if found.
            tags:
                - auth
            summary: Log out local user
            operationId: PostLogoutRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postLogoutPayload'
            responses:
                "204":
                    description: Success
                "400":
                    description: PublicHTTPValidationError
                    schema:
                        $ref: '#/definitions/publicHttpValidationError'
                "401":
                    description: PublicHTTPError
                    schema:
                        $ref: '#/definitions/publicHttpError'
            security:
                - Bearer: []
    /api/v1/auth/refresh:
        post:
            description: |-
                Returns a fresh set of access and refresh tokens if a valid refresh token was provided.
                The old refresh token used to authenticate the request will be invalidated.
            tags:
                - auth
            summary: Refresh tokens
            operationId: PostRefreshRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postRefreshPayload'
            responses:
                "200":
                    description: PostLoginResponse
                    schema:
                        $ref: '#/definitions/postLoginResponse'
                "400":
                    description: PublicHTTPValidationError
                    schema:
                        $ref: '#/definitions/publicHttpValidationError'
                "401":
                    description: PublicHTTPError
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "403":
                    description: PublicHTTPError, type `USER_DEACTIVATED`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/auth/register:
        get:
            produces:
                - text/html
            tags:
                - auth
            summary: Page to complete registration
            operationId: GetCompleteRegisterRoute
            parameters:
                - type: string
                  format: uuid4
                  description: Registration token to complete the registration process
                  name: token
                  in: query
                  required: true
            responses:
                "200":
                    description: Page to complete registration
        post:
            description: |
                Registers a local user. If the registration process requires a confirmation
                the status code `202` is returned without auth tokens. Afterwards the registration needs to be confirmed
                using the `POST /api/v1/auth/register/{registrationToken}` endpoint.
            tags:
                - auth
            summary: Registers a local user
            operationId: PostRegisterRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postRegisterPayload'
            responses:
                "200":
                    description: PostLoginResponse
                    schema:
                        $ref: '#/definitions/postLoginResponse'
                "202":
                    description: RegisterResponse
                    schema:
                        $ref: '#/definitions/registerResponse'
                "400":
                    description: PublicHTTPValidationError, type `INVALID_PASSWORD`
                    schema:
                        $ref: '#/definitions/publicHttpValidationError'
                "409":
                    description: PublicHTTPError, type `USER_ALREADY_EXISTS`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/auth/register/{registrationToken}:
        post:
            description: Completes registration for a local user
            tags:
                - auth
            summary: Complete registration
            operationId: PostCompleteRegisterRoute
            parameters:
                - type: string
                  format: uuid4
                  description: Registration token to complete the registration process
                  name: registrationToken
                  in: path
                  required: true
            responses:
                "200":
                    description: PostLoginResponse
                    schema:
                        $ref: '#/definitions/postLoginResponse'
                "401":
                    description: Unauthorized
    /api/v1/auth/userinfo:
        get:
            description: |-
                Returns user information compatible with the OpenID Connect Core 1.0 specification.
                Information returned depends on the requesting user as some data is only available if an app user profile exists.
            tags:
                - auth
            summary: Get user info
            operationId: GetUserInfoRoute
            responses:
                "200":
                    description: GetUserInfoResponse
                    schema:
                        $ref: '#/definitions/getUserInfoResponse'
            security:
                - Bearer: []
    /api/v1/checkout:
        post:
            description: |-
                Turns a client-side cart into an order and a payment intent.

                Only variant ids and quantities are honoured. Prices, totals and shipping
                are looked up or computed server-side and never accepted from the client.

                A 409 carries per-line detail saying WHICH items failed and why, so the
                frontend does not have to show "something went wrong" for a whole basket
                when one size sold out.
            tags:
                - merch
            summary: Checks out a cart
            operationId: PostCheckoutRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postCheckoutPayload'
            responses:
                "201":
                    description: Where to pay, and the totals computed server-side
                    schema:
                        $ref: '#/definitions/checkoutResponse'
                "400":
                    description: PublicHTTPError - the cart is empty
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "409":
                    description: Some lines are unavailable or out of stock; the body names which
                    schema:
                        $ref: '#/definitions/checkoutConflictResponse'
                "502":
                    description: PublicHTTPError - the payment provider could not be reached
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/contact-messages:
        post:
            description: |-
                Submits the contact form.

                Always returns 202, whether the message was stored or silently dropped by
                the per-sender throttle. Reporting "you submitted too recently" would
                confirm that an address has used the form.
            tags:
                - community
            summary: Submits a contact message
            operationId: PostContactMessageRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postContactMessagePayload'
            responses:
                "202":
                    description: Accepted
                "400":
                    description: PublicHTTPError - validation failed
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/donations/checkout:
        post:
            description: |-
                Starts a one-off donation and returns where to send the payer.

                No account is required. The response carries an access token, shown once,
                which is needed to read this donation's status afterwards -- the
                reference alone is not sufficient, since it travels in the callback URL.
            tags:
                - donations
            summary: Starts a one-off donation
            operationId: PostDonationCheckoutRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postDonationCheckoutPayload'
            responses:
                "201":
                    description: Where to pay
                    schema:
                        $ref: '#/definitions/donationCheckoutResponse'
                "400":
                    description: PublicHTTPError - the amount is outside the permitted range
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "502":
                    description: PublicHTTPError - the provider could not be reached; no money moved
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/donations/tiers:
        get:
            description: Lists the suggested donation amounts shown on the donate page.
            tags:
                - donations
            summary: Lists donation tiers
            operationId: GetDonationTiersRoute
            responses:
                "200":
                    description: The tiers
                    schema:
                        $ref: '#/definitions/donationTierList'
    /api/v1/donations/{reference}:
        get:
            description: |-
                Reports a donation's status to its donor.

                Requires the X-Donation-Token header issued at checkout. An unknown
                reference and a wrong token are reported identically, so this cannot be
                used to discover which references exist.

                If the donation is still pending, the server asks the provider
                server-to-server what actually happened and settles it through the same
                guarded path the webhook uses. It never trusts the redirect itself.
            tags:
                - donations
            summary: Reads a donation's status
            operationId: GetDonationStatusRoute
            parameters:
                - maxLength: 64
                  type: string
                  name: reference
                  in: path
                  required: true
                - maxLength: 64
                  type: string
                  name: X-Donation-Token
                  in: header
            responses:
                "200":
                    description: The donation status
                    schema:
                        $ref: '#/definitions/donationStatusResponse'
                "404":
                    description: PublicHTTPError - no such donation, or the token does not match
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/events:
        get:
            description: |-
                Lists published events, newest start date first, with optional category
                filtering and pagination. Unpublished and archived events are never returned.
            tags:
                - content
            summary: Lists published events
            operationId: GetEventsRoute
            parameters:
                - type: string
                  description: Category slug to filter by. Omit for all categories.
                  name: category
                  in: query
                - minimum: 1
                  type: integer
                  default: 1
                  description: 1-based page number.
                  name: page
                  in: query
                - maximum: 100
                  minimum: 1
                  type: integer
                  default: 6
                  description: Items per page.
                  name: perPage
                  in: query
            responses:
                "200":
                    description: A page of events
                    schema:
                        $ref: '#/definitions/galleryResponse'
    /api/v1/events/featured:
        get:
            description: |-
                Returns the single featured event. Exactly one published event may be
                featured at a time, enforced by a partial unique index rather than by
                convention.
            tags:
                - content
            summary: Returns the featured event
            operationId: GetFeaturedEventRoute
            responses:
                "200":
                    description: The featured event
                    schema:
                        $ref: '#/definitions/eventDetail'
                "404":
                    description: PublicHTTPError, type `GENERIC` - no event is currently featured
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/events/{slug}:
        get:
            description: Returns a single published event by its slug.
            tags:
                - content
            summary: Returns an event by slug
            operationId: GetEventRoute
            parameters:
                - type: string
                  name: slug
                  in: path
                  required: true
            responses:
                "200":
                    description: The event
                    schema:
                        $ref: '#/definitions/eventDetail'
                "404":
                    description: PublicHTTPError, type `GENERIC`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/events/{slug}/register:
        post:
            description: |-
                Registers for an event.

                Whether payment is required follows from the TIER's price, never from the
                request, so a client cannot ask to skip it. A free tier confirms
                immediately; a paid tier reserves the seats and returns somewhere to pay.
                Seats are held only until the payment intent expires.
            tags:
                - ticketing
            summary: Registers for an event
            operationId: PostEventRegistrationRoute
            parameters:
                - type: string
                  name: slug
                  in: path
                  required: true
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postEventRegistrationPayload'
            responses:
                "201":
                    description: The registration
                    schema:
                        $ref: '#/definitions/eventRegistrationResponse'
                "400":
                    description: PublicHTTPError - more tickets than one order may hold
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "404":
                    description: PublicHTTPError - no such event or ticket tier
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "409":
                    description: PublicHTTPError - sold out, already registered, or sales are not open
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "502":
                    description: PublicHTTPError - the payment provider could not be reached
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/events/{slug}/tiers:
        get:
            description: |-
                Lists the ticket types for an event, with the seats still available after
                in-flight holds are taken into account.
            tags:
                - ticketing
            summary: Lists an event's ticket tiers
            operationId: GetEventTicketTiersRoute
            parameters:
                - type: string
                  name: slug
                  in: path
                  required: true
            responses:
                "200":
                    description: The tiers
                    schema:
                        $ref: '#/definitions/ticketTierList'
                "404":
                    description: PublicHTTPError - no such published event
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/faqs:
        get:
            description: Lists published FAQs, optionally narrowed to one category.
            tags:
                - community
            summary: Lists published FAQs
            operationId: GetFAQsRoute
            parameters:
                - maxLength: 80
                  type: string
                  name: category
                  in: query
            responses:
                "200":
                    description: The FAQs
                    schema:
                        $ref: '#/definitions/fAQList'
    /api/v1/membership/applications:
        post:
            description: |-
                Applies to join the community.

                Always returns 202 -- for a new application, a duplicate, and a previously
                rejected address alike. The EMAIL that follows differs; the RESPONSE never
                does. Anything else would turn this endpoint into a membership-list
                oracle.
            tags:
                - community
            summary: Applies to join the community
            operationId: PostMembershipApplicationRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postMembershipApplicationPayload'
            responses:
                "202":
                    description: Accepted
                "400":
                    description: PublicHTTPError - validation failed
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/membership/invitations/{token}/accept:
        post:
            description: |-
                Accepts an invitation by choosing a password, creating the account and
                returning a session.

                A not-found, not-approved and expired invitation are reported
                identically, so the endpoint cannot be used to discover which invitations
                exist.
            tags:
                - community
            summary: Accepts a membership invitation
            operationId: PostAcceptInvitationRoute
            parameters:
                - type: string
                  format: uuid4
                  name: token
                  in: path
                  required: true
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/postAcceptInvitationPayload'
            responses:
                "200":
                    description: The new session
                    schema:
                        $ref: '#/definitions/postLoginResponse'
                "400":
                    description: PublicHTTPError - the password does not meet the policy
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "404":
                    description: PublicHTTPError - the invitation is not valid
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "409":
                    description: PublicHTTPError - an account already exists for that address
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/products:
        get:
            description: |-
                Lists the published catalogue with per-variant availability.

                Availability subtracts in-flight holds as well as sales: stock someone is
                part-way through paying for is not for sale.
            tags:
                - merch
            summary: Lists products
            operationId: GetProductsRoute
            responses:
                "200":
                    description: The catalogue
                    schema:
                        $ref: '#/definitions/productList'
    /api/v1/push/token:
        put:
            description: |-
                Adds a push token for the given provider to the current user.
                If the oldToken is present it will be deleted.
                Currently only the provider 'fcm' is supported.
            tags:
                - push
            summary: Adds a push token to the user
            operationId: PutUpdatePushTokenRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/putUpdatePushTokenPayload'
            responses:
                "200":
                    description: OK
                "404":
                    description: PublicHTTPError, type `OLD_PUSH_TOKEN_NOT_FOUND`
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "409":
                    description: PublicHTTPError, type `PUSH_TOKEN_ALREADY_EXISTS`
                    schema:
                        $ref: '#/definitions/publicHttpError'
            security:
                - Bearer: []
    /api/v1/resources:
        get:
            description: |-
                Lists published resources with optional full-text search, category filtering
                and pagination. When a search term is given, results are ordered by relevance,
                weighted so a title match outranks a body mention; otherwise by publication
                date. A search consisting only of punctuation returns everything rather than
                failing.
            tags:
                - content
            summary: Lists published resources
            operationId: GetResourcesRoute
            parameters:
                - maxLength: 200
                  type: string
                  description: Full-text search term.
                  name: q
                  in: query
                - type: string
                  description: Category slug to filter by. Omit for all categories.
                  name: category
                  in: query
                - minimum: 1
                  type: integer
                  default: 1
                  name: page
                  in: query
                - maximum: 100
                  minimum: 1
                  type: integer
                  default: 6
                  name: perPage
                  in: query
            responses:
                "200":
                    description: A page of resources
                    schema:
                        $ref: '#/definitions/galleryResponse'
    /api/v1/resources/{slug}:
        get:
            description: Returns a single published resource by its slug.
            tags:
                - content
            summary: Returns a resource by slug
            operationId: GetResourceRoute
            parameters:
                - type: string
                  name: slug
                  in: path
                  required: true
            responses:
                "200":
                    description: The resource
                    schema:
                        $ref: '#/definitions/resourceDetail'
                "404":
                    description: PublicHTTPError, type `GENERIC`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /swagger.yml:
        get:
            description: |-
                OpenAPI Specification ver. 2 (fka Swagger)
                Returns our handcrafted and validated `swagger.yml`.
            produces:
                - text/plain
            tags:
                - common
            summary: Get swagger.yml
            operationId: GetSwaggerRoute
            responses:
                "200":
                    description: OK
    /webhooks/payments:
        post:
            description: |-
                Receives payment-provider notifications.

                Authenticated by an HMAC over the RAW request body, not by a bearer
                token. Note the provider's signature carries no timestamp and no nonce,
                so there is no replay window: anyone who ever observes one valid delivery
                can replay it verbatim forever and it will still verify. Replay
                protection is entirely server-side, via a unique idempotency key plus
                guarded state transitions.

                Always answers 200 for an authentic event, including a duplicate and an
                event type not acted on -- a non-2xx makes the provider retry for up to
                72 hours.
            tags:
                - webhooks
            summary: Receives payment provider webhooks
            operationId: PostPaymentWebhookRoute
            responses:
                "200":
                    description: Received
                "400":
                    description: Malformed body
                "401":
                    description: The signature did not verify
                "500":
                    description: Recording failed; the provider should retry
definitions:
    archivePayload:
        type: object
        required:
            - archived
        properties:
            archived:
                type: boolean
    cartLine:
        description: An id and a count. Prices are never accepted from the client.
        type: object
        required:
            - variantId
            - quantity
        properties:
            quantity:
                type: integer
                maximum: 100
                minimum: 1
            variantId:
                type: string
                format: uuid4
    cartProblem:
        description: One cart line that could not be fulfilled, so the client can say which.
        type: object
        required:
            - variantId
            - reason
            - available
        properties:
            available:
                type: integer
            reason:
                type: string
                enum:
                    - unavailable
                    - out_of_stock
            variantId:
                type: string
                format: uuid4
    category:
        type: object
        required:
            - id
            - scope
            - slug
            - name
            - sortOrder
        properties:
            id:
                type: string
                format: uuid4
            name:
                type: string
                example: Workshop
            scope:
                type: string
                enum:
                    - event
                    - resource
            slug:
                type: string
                example: workshop
            sortOrder:
                type: integer
    categoryList:
        type: object
        required:
            - items
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/category'
    checkoutConflictResponse:
        description: |-
            A 409 from checkout, carrying per-line detail.

            PublicHTTPError's `detail` is a plain string, which cannot say WHICH cart
            line failed. A client that only learns "something is unavailable" has to
            make the customer re-check a whole basket by hand, so this response keeps
            the standard error envelope and adds a machine-readable list.
        type: object
        required:
            - status
            - type
            - title
            - problems
        properties:
            problems:
                type: array
                items:
                    $ref: '#/definitions/cartProblem'
            status:
                type: integer
                format: int64
                example: 409
            title:
                type: string
            type:
                $ref: '#/definitions/publicHttpErrorType'
    checkoutResponse:
        type: object
        required:
            - reference
            - authorizationUrl
            - accessToken
            - subtotalKobo
            - shippingKobo
            - taxKobo
            - totalKobo
        properties:
            accessToken:
                description: Shown once. Send as X-Order-Token when reading order status.
                type: string
            authorizationUrl:
                type: string
            reference:
                type: string
            shippingKobo:
                type: integer
            subtotalKobo:
                type: integer
            taxKobo:
                description: Added on top of goods and shipping. Zero unless a VAT rate is configured.
                type: integer
            totalKobo:
                type: integer
    deleteUserAccountPayload:
        type: object
        required:
            - currentPassword
        properties:
            currentPassword:
                description: Current password of user
                type: string
                maxLength: 500
                minLength: 1
                example: correct horse battery staple
    donation:
        type: object
        required:
            - id
            - reference
            - status
            - amountKobo
            - currency
            - email
            - isAnonymous
            - createdAt
        properties:
            amountKobo:
                type: integer
            createdAt:
                type: string
                format: date-time
            currency:
                type: string
            displayName:
                type: string
                x-nullable: true
            email:
                type: string
                format: email
            id:
                type: string
                format: uuid4
            isAnonymous:
                type: boolean
            reference:
                type: string
            status:
                type: string
    donationCheckoutResponse:
        description: |-
            Where to send the payer, plus the token needed to read this donation's
            status afterwards. The token is shown ONCE: only its hash is stored.
        type: object
        required:
            - reference
            - authorizationUrl
            - accessToken
            - amountKobo
        properties:
            accessToken:
                description: Send as the X-Donation-Token header when reading status. Shown once.
                type: string
            amountKobo:
                type: integer
            authorizationUrl:
                description: Redirect the payer here.
                type: string
            reference:
                type: string
                example: cld_don_K4M2P9XQ7RTVWZ3B
    donationList:
        type: object
        required:
            - items
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/donation'
    donationStatusResponse:
        type: object
        required:
            - reference
            - status
            - amountKobo
            - currency
        properties:
            amountKobo:
                type: integer
            currency:
                type: string
            reference:
                type: string
            status:
                type: string
                enum:
                    - pending
                    - active
                    - completed
                    - past_due
                    - cancelled
                    - failed
    donationTier:
        type: object
        required:
            - id
            - name
            - amountKobo
        properties:
            amountKobo:
                description: Amount in kobo. Never a decimal - money is integer minor units.
                type: integer
                example: 500000
            description:
                type: string
            id:
                type: string
                format: uuid4
            interval:
                description: Empty for a one-off suggestion; "monthly" or "annually" for recurring tiers.
                type: string
            name:
                type: string
                example: Supporter
    donationTierList:
        type: object
        required:
            - items
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/donationTier'
    eventDetail:
        description: |-
            A single event. Times are absolute instants plus the IANA zone the organiser
            meant, so a client can render "9AM - 5PM WAT" correctly regardless of the
            viewer's own timezone.
        type: object
        required:
            - id
            - slug
            - title
            - summary
            - body
            - category
            - startAt
            - endAt
            - timezone
            - isOnline
            - isFeatured
        properties:
            body:
                type: string
            category:
                type: string
            endAt:
                type: string
                format: date-time
            id:
                type: string
                format: uuid4
            image:
                type: string
                x-nullable: true
            isFeatured:
                type: boolean
            isOnline:
                type: boolean
            meetingURL:
                type: string
                x-nullable: true
            slug:
                type: string
                example: aws-certification-workshop-lagos
            startAt:
                type: string
                format: date-time
            status:
                type: string
                enum:
                    - Open
                    - Limited
                    - Sold Out
                x-nullable: true
            summary:
                type: string
            timezone:
                description: IANA timezone name.
                type: string
                example: Africa/Lagos
            title:
                type: string
            venueAddress:
                type: string
                x-nullable: true
            venueName:
                type: string
                x-nullable: true
    eventRegistrationResponse:
        description: |-
            A free RSVP comes back confirmed, with no reference and nothing to pay. A
            paid registration comes back reserved, with somewhere to pay and a token
            for checking on it afterwards.
        type: object
        required:
            - ticketCode
            - status
            - amountKobo
        properties:
            accessToken:
                description: Present for paid tiers only. Shown once.
                type: string
            amountKobo:
                type: integer
            authorizationUrl:
                description: Present for paid tiers only. Redirect the payer here.
                type: string
            reference:
                type: string
            status:
                type: string
                enum:
                    - reserved
                    - confirmed
                    - cancelled
                    - refunded
            ticketCode:
                type: string
                example: CLD-4H9KM-2P7QR
    fAQ:
        type: object
        required:
            - id
            - question
            - answer
            - category
        properties:
            answer:
                type: string
            category:
                type: string
            id:
                type: string
                format: uuid4
            question:
                type: string
    fAQList:
        type: object
        required:
            - items
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/fAQ'
    featurePayload:
        type: object
        required:
            - featured
        properties:
            featured:
                type: boolean
    galleryItem:
        description: |-
            A single card in a content gallery. This is deliberately the shape the frontend's
            `ResourceItem` type already declares, so both the events and the resources pages
            render it through the same component without a client-side transform.
            `status` is populated for events only, where it is derived from ticket-tier
            capacity at read time; it is never stored and is absent for resources.
        type: object
        required:
            - id
            - category
            - date
            - title
            - description
            - image
        properties:
            category:
                type: string
                example: Workshop
            date:
                type: string
                format: date-time
                example: "2026-09-14T09:00:00+01:00"
            description:
                type: string
                example: Hands-on training covering Cloud Practitioner and Solutions Architect associate tracks.
            href:
                type: string
                x-nullable: true
                example: /events/aws-certification-workshop-lagos
            id:
                type: string
                example: evt-aws-workshop-lagos
            image:
                type: string
                example: https://media.cloudadore.com/events/aws-workshop.jpg
            status:
                description: Events only. Derived from remaining capacity, never stored.
                type: string
                enum:
                    - Open
                    - Limited
                    - Sold Out
                x-nullable: true
                example: Open
            title:
                type: string
                example: 'AWS Certification Workshop: Lagos Edition'
    galleryResponse:
        description: A page of gallery items plus the tab list the frontend renders above them.
        type: object
        required:
            - items
            - categories
            - total
            - page
            - perPage
        properties:
            categories:
                description: Distinct categories in this scope, for the filter tabs.
                type: array
                items:
                    type: string
                example:
                    - Workshop
                    - Conference
                    - Meetup
            items:
                type: array
                items:
                    $ref: '#/definitions/galleryItem'
            page:
                type: integer
                example: 1
            perPage:
                type: integer
                example: 6
            total:
                description: Total matching items across all pages.
                type: integer
                example: 42
    getUserInfoResponse:
        type: object
        required:
            - sub
            - updated_at
        properties:
            email:
                description: Email address of user, if available
                type: string
                format: email
                maxLength: 255
                example: user@example.com
            scopes:
                description: Auth-Scopes of the user, if available
                type: array
                items:
                    $ref: '#/definitions/userScope'
                example:
                    - app
            sub:
                description: ID of user
                type: string
                example: 82ebdfad-c586-4407-a873-4cc1c33d56fc
            updated_at:
                description: Unix timestamp the user's info was last updated at
                type: integer
                example: 1591960808
    httpValidationErrorDetail:
        type: object
        required:
            - key
            - in
            - error
        properties:
            error:
                description: Error describing field validation failure
                type: string
            in:
                description: Indicates how the invalid field was provided
                type: string
            key:
                description: Key of field failing validation
                type: string
    media:
        type: object
        required:
            - id
            - status
            - contentType
            - byteSize
        properties:
            byteSize:
                description: The actual stored size, read back from the object store.
                type: integer
            contentType:
                description: The DETECTED content type, which may differ from the declared one.
                type: string
            id:
                type: string
                format: uuid4
            publicUrl:
                type: string
                x-nullable: true
            status:
                type: string
                enum:
                    - pending
                    - ready
                    - rejected
    mediaPresignResponse:
        type: object
        required:
