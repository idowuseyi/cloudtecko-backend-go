                maxLength: 120
            body:
                type: string
                maxLength: 50000
            categorySlug:
                type: string
                maxLength: 80
            contentUrl:
                type: string
                maxLength: 500
                x-nullable: true
            heroMediaId:
                type: string
                format: uuid4
                x-nullable: true
            kind:
                type: string
                enum:
                    - article
                    - guide
                    - video
                    - download
                    - link
            readingTimeMinutes:
                type: integer
                default: 0
                maximum: 1000
                minimum: 0
            summary:
                type: string
                maxLength: 500
                minLength: 1
            title:
                type: string
                maxLength: 200
                minLength: 1
    product:
        type: object
        required:
            - id
            - slug
            - title
            - variants
        properties:
            description:
                type: string
            id:
                type: string
                format: uuid4
            image:
                type: string
                x-nullable: true
            slug:
                type: string
            title:
                type: string
            variants:
                type: array
                items:
                    $ref: '#/definitions/productVariant'
    productList:
        type: object
        required:
