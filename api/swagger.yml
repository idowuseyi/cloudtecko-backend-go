        get:
            description: |-
                Returns the single featured event. Exactly one published event may be
                featured at a time, enforced by a partial unique index rather than by
                convention.
            tags:
                - content
            summary: Returns the featured event
            operationId: GetFeaturedEventRoute
            responses:
                "200":
                    description: The featured event
                    schema:
                        $ref: '#/definitions/eventDetail'
                "404":
                    description: PublicHTTPError, type `GENERIC` - no event is currently featured
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/events/{slug}:
        get:
            description: Returns a single published event by its slug.
            tags:
                - content
            summary: Returns an event by slug
            operationId: GetEventRoute
            parameters:
                - type: string
                  name: slug
                  in: path
                  required: true
            responses:
                "200":
                    description: The event
                    schema:
                        $ref: '#/definitions/eventDetail'
                "404":
                    description: PublicHTTPError, type `GENERIC`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /api/v1/push/token:
        put:
            description: |-
                Adds a push token for the given provider to the current user.
                If the oldToken is present it will be deleted.
                Currently only the provider 'fcm' is supported.
            tags:
                - push
            summary: Adds a push token to the user
            operationId: PutUpdatePushTokenRoute
            parameters:
                - name: Payload
                  in: body
                  schema:
                    $ref: '#/definitions/putUpdatePushTokenPayload'
            responses:
                "200":
                    description: OK
                "404":
                    description: PublicHTTPError, type `OLD_PUSH_TOKEN_NOT_FOUND`
                    schema:
                        $ref: '#/definitions/publicHttpError'
                "409":
                    description: PublicHTTPError, type `PUSH_TOKEN_ALREADY_EXISTS`
                    schema:
                        $ref: '#/definitions/publicHttpError'
            security:
                - Bearer: []
    /api/v1/resources:
        get:
            description: |-
                Lists published resources with optional full-text search, category filtering
                and pagination. When a search term is given, results are ordered by relevance,
                weighted so a title match outranks a body mention; otherwise by publication
                date. A search consisting only of punctuation returns everything rather than
                failing.
            tags:
                - content
            summary: Lists published resources
            operationId: GetResourcesRoute
            parameters:
                - maxLength: 200
                  type: string
                  description: Full-text search term.
                  name: q
                  in: query
                - type: string
                  description: Category slug to filter by. Omit for all categories.
                  name: category
                  in: query
                - minimum: 1
                  type: integer
                  default: 1
                  name: page
                  in: query
                - maximum: 100
                  minimum: 1
                  type: integer
                  default: 6
                  name: perPage
                  in: query
            responses:
                "200":
                    description: A page of resources
                    schema:
                        $ref: '#/definitions/galleryResponse'
    /api/v1/resources/{slug}:
        get:
            description: Returns a single published resource by its slug.
            tags:
                - content
            summary: Returns a resource by slug
            operationId: GetResourceRoute
            parameters:
                - type: string
                  name: slug
                  in: path
                  required: true
            responses:
                "200":
                    description: The resource
                    schema:
                        $ref: '#/definitions/resourceDetail'
                "404":
                    description: PublicHTTPError, type `GENERIC`
                    schema:
                        $ref: '#/definitions/publicHttpError'
    /swagger.yml:
        get:
            description: |-
                OpenAPI Specification ver. 2 (fka Swagger)
                Returns our handcrafted and validated `swagger.yml`.
            produces:
                - text/plain
            tags:
                - common
            summary: Get swagger.yml
            operationId: GetSwaggerRoute
            responses:
                "200":
                    description: OK
definitions:
    archivePayload:
        type: object
        required:
            - archived
        properties:
            archived:
                type: boolean
    category:
        type: object
        required:
            - id
            - scope
            - slug
            - name
            - sortOrder
        properties:
            id:
                type: string
                format: uuid4
            name:
                type: string
                example: Workshop
            scope:
                type: string
                enum:
                    - event
                    - resource
            slug:
                type: string
                example: workshop
            sortOrder:
                type: integer
    categoryList:
        type: object
        required:
            - items
        properties:
            items:
                type: array
                items:
                    $ref: '#/definitions/category'
    deleteUserAccountPayload:
        type: object
        required:
            - currentPassword
        properties:
            currentPassword:
                description: Current password of user
                type: string
                maxLength: 500
                minLength: 1
                example: correct horse battery staple
    eventDetail:
        description: |-
            A single event. Times are absolute instants plus the IANA zone the organiser
            meant, so a client can render "9AM - 5PM WAT" correctly regardless of the
            viewer's own timezone.
        type: object
        required:
            - id
            - slug
            - title
            - summary
            - body
            - category
            - startAt
            - endAt
            - timezone
            - isOnline
            - isFeatured
        properties:
            body:
                type: string
            category:
                type: string
            endAt:
                type: string
                format: date-time
            id:
                type: string
                format: uuid4
            image:
                type: string
                x-nullable: true
            isFeatured:
                type: boolean
            isOnline:
                type: boolean
            meetingURL:
                type: string
                x-nullable: true
            slug:
                type: string
                example: aws-certification-workshop-lagos
            startAt:
                type: string
                format: date-time
            status:
                type: string
                enum:
                    - Open
                    - Limited
                    - Sold Out
                x-nullable: true
            summary:
                type: string
            timezone:
                description: IANA timezone name.
                type: string
                example: Africa/Lagos
            title:
                type: string
            venueAddress:
                type: string
                x-nullable: true
            venueName:
                type: string
                x-nullable: true
    featurePayload:
        type: object
        required:
            - featured
        properties:
            featured:
                type: boolean
    galleryItem:
        description: |-
            A single card in a content gallery. This is deliberately the shape the frontend's
            `ResourceItem` type already declares, so both the events and the resources pages
            render it through the same component without a client-side transform.
            `status` is populated for events only, where it is derived from ticket-tier
            capacity at read time; it is never stored and is absent for resources.
        type: object
        required:
            - id
            - category
            - date
            - title
            - description
            - image
        properties:
            category:
                type: string
                example: Workshop
            date:
                type: string
                format: date-time
                example: "2026-09-14T09:00:00+01:00"
            description:
                type: string
                example: Hands-on training covering Cloud Practitioner and Solutions Architect associate tracks.
            href:
                type: string
                x-nullable: true
                example: /events/aws-certification-workshop-lagos
            id:
                type: string
                example: evt-aws-workshop-lagos
            image:
                type: string
                example: https://media.cloudadore.com/events/aws-workshop.jpg
            status:
                description: Events only. Derived from remaining capacity, never stored.
                type: string
                enum:
                    - Open
                    - Limited
                    - Sold Out
                x-nullable: true
                example: Open
            title:
                type: string
                example: 'AWS Certification Workshop: Lagos Edition'
    galleryResponse:
        description: A page of gallery items plus the tab list the frontend renders above them.
        type: object
        required:
            - items
            - categories
            - total
            - page
            - perPage
        properties:
            categories:
                description: Distinct categories in this scope, for the filter tabs.
                type: array
                items:
                    type: string
                example:
                    - Workshop
                    - Conference
                    - Meetup
            items:
                type: array
                items:
                    $ref: '#/definitions/galleryItem'
            page:
                type: integer
                example: 1
            perPage:
                type: integer
                example: 6
            total:
                description: Total matching items across all pages.
                type: integer
                example: 42
    getUserInfoResponse:
        type: object
        required:
            - sub
            - updated_at
        properties:
            email:
                description: Email address of user, if available
                type: string
                format: email
                maxLength: 255
                example: user@example.com
            scopes:
                description: Auth-Scopes of the user, if available
                type: array
                items:
                    $ref: '#/definitions/userScope'
                example:
                    - app
            sub:
                description: ID of user
                type: string
                example: 82ebdfad-c586-4407-a873-4cc1c33d56fc
            updated_at:
                description: Unix timestamp the user's info was last updated at
                type: integer
                example: 1591960808
    httpValidationErrorDetail:
        type: object
        required:
            - key
            - in
            - error
        properties:
            error:
                description: Error describing field validation failure
                type: string
            in:
                description: Indicates how the invalid field was provided
                type: string
            key:
                description: Key of field failing validation
                type: string
    orderDir:
        type: string
        enum:
            - asc
            - desc
    postCategoryPayload:
        type: object
        required:
            - scope
            - slug
            - name
        properties:
            name:
                type: string
                maxLength: 120
                minLength: 1
            scope:
                type: string
                enum:
                    - event
                    - resource
            slug:
                type: string
                maxLength: 80
                minLength: 1
                pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                example: workshop
            sortOrder:
                type: integer
                default: 0
                minimum: 0
    postChangePasswordPayload:
        type: object
        required:
            - currentPassword
            - newPassword
        properties:
            currentPassword:
                description: Current password of user
                type: string
                maxLength: 500
                minLength: 1
                example: correct horse battery staple
            newPassword:
                description: New password to set for user
                type: string
                maxLength: 500
                minLength: 15
                example: correct horse battery staple
    postEventPayload:
        description: |-
            Create or update an event. `slug` is absent deliberately: it is derived from
            the title on creation and is immutable afterwards, because a published slug
            is a permanent public address that shared links and search results depend on.
        type: object
        required:
            - title
            - summary
            - categorySlug
            - startAt
            - endAt
            - timezone
        properties:
            body:
                type: string
                maxLength: 20000
            categorySlug:
                type: string
                maxLength: 80
            endAt:
                type: string
                format: date-time
            heroMediaId:
                type: string
                format: uuid4
                x-nullable: true
            isOnline:
                type: boolean
                default: false
            meetingUrl:
                type: string
                maxLength: 500
                x-nullable: true
            startAt:
                type: string
                format: date-time
            summary:
                type: string
                maxLength: 500
                minLength: 1
            timezone:
                description: IANA timezone name, e.g. Africa/Lagos.
                type: string
                maxLength: 64
                minLength: 1
            title:
                type: string
                maxLength: 200
                minLength: 1
            venueAddress:
                type: string
                maxLength: 500
                x-nullable: true
            venueName:
                type: string
                maxLength: 200
                x-nullable: true
    postForgotPasswordCompletePayload:
        type: object
        required:
            - token
            - password
        properties:
            password:
                description: New password to set for user
                type: string
                maxLength: 500
                minLength: 15
                example: correct horse battery staple
            token:
                description: Password reset token sent via email
                type: string
                format: uuid4
                example: ec16f032-3c44-4148-bbcc-45557466fa74
    postForgotPasswordPayload:
        type: object
        required:
            - username
        properties:
            username:
                description: Username to initiate password reset for
                type: string
                format: email
                maxLength: 255
                minLength: 1
                example: user@example.com
    postLoginPayload:
        type: object
        required:
            - username
            - password
        properties:
            password:
                description: Password of user to authenticate as
                type: string
                maxLength: 500
                minLength: 1
                example: correct horse battery staple
            username:
                description: Username of user to authenticate as
                type: string
                format: email
                maxLength: 255
                minLength: 1
                example: user@example.com
    postLoginResponse:
        type: object
        required:
            - access_token
            - token_type
            - expires_in
            - refresh_token
        properties:
            access_token:
                description: Access token required for accessing protected API endpoints
                type: string
                format: uuid4
                example: c1247d8d-0d65-41c4-bc86-ec041d2ac437
            expires_in:
                description: Access token expiry in seconds
                type: integer
                format: int64
                example: 86400
            refresh_token:
                description: Refresh token for refreshing the access token once it expires
                type: string
                format: uuid4
                example: 1dadb3bd-50d8-485d-83a3-6111392568f0
            token_type:
                description: Type of access token, will always be `bearer`
                type: string
                example: bearer
    postLogoutPayload:
        type: object
        properties:
            refresh_token:
                description: Optional refresh token to delete while logging out
                type: string
                format: uuid4
                example: 700ebed3-40f7-4211-bc83-a89b22b9875e
    postRefreshPayload:
        type: object
        required:
            - refresh_token
        properties:
            refresh_token:
                description: Refresh token to use for retrieving new token set
                type: string
                format: uuid4
                example: 7503cd8a-c921-4368-a32d-6c1d01d86da9
    postRegisterPayload:
        type: object
        required:
            - username
            - password
        properties:
            password:
                description: Password to register with
                type: string
                maxLength: 500
                minLength: 15
                example: correct horse battery staple
            username:
                description: Username to register with
                type: string
                format: email
                maxLength: 255
                minLength: 1
                example: user@example.com
    postResourcePayload:
        type: object
        required:
            - title
            - summary
            - kind
            - categorySlug
        properties:
            author:
                type: string
                maxLength: 120
            body:
                type: string
                maxLength: 50000
            categorySlug:
                type: string
                maxLength: 80
            contentUrl:
                type: string
                maxLength: 500
                x-nullable: true
            heroMediaId:
                type: string
                format: uuid4
                x-nullable: true
            kind:
                type: string
                enum:
                    - article
                    - guide
                    - video
                    - download
                    - link
            readingTimeMinutes:
                type: integer
                default: 0
                maximum: 1000
                minimum: 0
            summary:
                type: string
                maxLength: 500
                minLength: 1
            title:
                type: string
                maxLength: 200
                minLength: 1
    publicHttpError:
        type: object
        required:
            - status
            - type
            - title
        properties:
            detail:
                description: More detailed, human-readable, optional explanation of the error
                type: string
                example: User is lacking permission to access this resource
            status:
                description: HTTP status code returned for the error
                type: integer
                format: int64
                maximum: 599
                minimum: 100
                x-go-name: Code
                example: 403
            title:
                description: Short, human-readable description of the error
                type: string
                example: Forbidden
            type:
                $ref: '#/definitions/publicHttpErrorType'
    publicHttpErrorType:
        description: Type of error returned, should be used for client-side error handling
        type: string
        enum:
            - generic
            - PUSH_TOKEN_ALREADY_EXISTS
            - OLD_PUSH_TOKEN_NOT_FOUND
            - ZERO_FILE_SIZE
            - USER_DEACTIVATED
            - INVALID_PASSWORD
            - NOT_LOCAL_USER
            - TOKEN_NOT_FOUND
            - TOKEN_EXPIRED
            - USER_ALREADY_EXISTS
            - MALFORMED_TOKEN
            - LAST_AUTHENTICATED_AT_EXCEEDED
            - MISSING_SCOPES
    publicHttpValidationError:
        type: object
        required:
            - validationErrors
        allOf:
            - $ref: '#/definitions/publicHttpError'
        properties:
            validationErrors:
                description: List of errors received while validating payload against schema
                type: array
                items:
                    $ref: '#/definitions/httpValidationErrorDetail'
    publishPayload:
        type: object
        required:
            - published
        properties:
            published:
                type: boolean
    putUpdatePushTokenPayload:
        type: object
        required:
            - newToken
            - provider
        properties:
            newToken:
                description: New push token for given provider.
                type: string
                maxLength: 500
                example: 1c91e550-8167-439c-8021-dee7de2f7e96
            oldToken:
                description: Old token that can be deleted if present.
                type: string
                maxLength: 500
                x-nullable: true
                example: 495179de-b771-48f0-aab2-8d23701b0f02
            provider:
                description: Identifier of the provider the token is for (eg. "fcm", "apn"). Currently only "fcm" is supported.
                type: string
                maxLength: 500
                example: fcm
    registerResponse:
        type: object
        required:
            - requiresConfirmation
        properties:
            requiresConfirmation:
                description: Indicates whether the registration process requires email confirmation
                type: boolean
                example: true
    resourceDetail:
        type: object
        required:
            - id
            - slug
            - title
            - summary
            - body
            - kind
            - category
            - author
            - readingTimeMinutes
        properties:
            author:
                type: string
            body:
                type: string
            category:
                type: string
            contentURL:
                type: string
                x-nullable: true
            id:
                type: string
                format: uuid4
            image:
                type: string
                x-nullable: true
            kind:
                type: string
                enum:
                    - article
                    - guide
                    - video
                    - download
                    - link
            publishedAt:
                type: string
                format: date-time
                x-nullable: true
            readingTimeMinutes:
                type: integer
            slug:
                type: string
                example: serverless-security-protecting-your-functions
            summary:
                type: string
            title:
                type: string
    userScope:
        type: string
        enum:
            - app
            - cms
            - admin
parameters:
    registrationTokenParam:
        type: string
        format: uuid4
        description: Registration token to complete the registration process
        name: registrationToken
        in: path
        required: true
responses:
    AuthForbiddenResponse:
        description: PublicHTTPError, type `USER_DEACTIVATED`/`NOT_LOCAL_USER`
        schema:
            $ref: '#/definitions/publicHttpError'
    AuthUnauthorizedResponse:
        description: PublicHTTPError
        schema:
            $ref: '#/definitions/publicHttpError'
    InvalidPasswordResponse:
        description: PublicHTTPValidationError, type `INVALID_PASSWORD`
        schema:
            $ref: '#/definitions/publicHttpValidationError'
    ValidationError:
        description: PublicHTTPValidationError
        schema:
            $ref: '#/definitions/publicHttpValidationError'
securityDefinitions:
    Bearer:
        description: |-
            Access token for application access, **must** include "Bearer " prefix.
            Example: `Bearer b4a94a42-3ea2-4af3-9699-8bcbfee6e6d2`
        type: apiKey
        name: Authorization
        in: header
        x-keyPrefix: 'Bearer '
    Management:
        description: Management secret, used for monitoring and infrastructure related calls
        type: apiKey
        name: mgmt-secret
        in: query
