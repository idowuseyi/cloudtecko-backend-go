            - uploadUrl
            - expiresAt
        properties:
            expiresAt:
                type: string
                format: date-time
            id:
                type: string
                format: uuid4
            uploadUrl:
                description: PUT the file bytes here. Treat as a short-lived secret.
                type: string
    membershipApplication:
        type: object
        required:
            - id
            - email
            - fullName
            - motivation
            - status
            - createdAt
        properties:
            createdAt:
                type: string
                format: date-time
            email:
                type: string
                format: email
            fullName:
                type: string
            id:
                type: string
                format: uuid4
            motivation:
                type: string
            organisation:
                type: string
                x-nullable: true
            reviewNote:
                type: string
                x-nullable: true
            status:
                type: string
                enum:
                    - pending
