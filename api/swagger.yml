            name:
                type: string
                maxLength: 200
                minLength: 1
            subject:
                type: string
                enum:
                    - general
                    - support
                    - partnership
    postDonationCheckoutPayload:
        type: object
        required:
            - email
            - amountKobo
        properties:
            amountKobo:
                description: Amount in kobo, bounded server-side.
                type: integer
                minimum: 1
                example: 10000
            displayName:
                type: string
                maxLength: 200
                x-nullable: true
            email:
                type: string
                format: email
                maxLength: 255
            isAnonymous:
                type: boolean
                default: false
    postEventPayload:
        description: |-
            Create or update an event. `slug` is absent deliberately: it is derived from
            the title on creation and is immutable afterwards, because a published slug
            is a permanent public address that shared links and search results depend on.
        type: object
        required:
            - title
            - summary
            - categorySlug
            - startAt
            - endAt
            - timezone
        properties:
            body:
                type: string
                maxLength: 20000
            categorySlug:
                type: string
                maxLength: 80
            endAt:
                type: string
                format: date-time
            heroMediaId:
                type: string
                format: uuid4
                x-nullable: true
            isOnline:
                type: boolean
                default: false
            meetingUrl:
                type: string
                maxLength: 500
                x-nullable: true
            startAt:
                type: string
                format: date-time
            summary:
                type: string
                maxLength: 500
                minLength: 1
            timezone:
                description: IANA timezone name, e.g. Africa/Lagos.
                type: string
                maxLength: 64
                minLength: 1
            title:
                type: string
                maxLength: 200
                minLength: 1
            venueAddress:
                type: string
                maxLength: 500
                x-nullable: true
            venueName:
                type: string
                maxLength: 200
                x-nullable: true
    postEventRegistrationPayload:
        type: object
        required:
