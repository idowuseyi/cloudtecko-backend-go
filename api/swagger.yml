            shippingCity:
                type: string
                maxLength: 120
                x-nullable: true
            shippingCountry:
                type: string
                maxLength: 120
                x-nullable: true
            shippingLine1:
                type: string
                maxLength: 200
                x-nullable: true
            shippingLine2:
                type: string
                maxLength: 200
                x-nullable: true
            shippingPostcode:
                type: string
                maxLength: 32
                x-nullable: true
            shippingState:
                type: string
                maxLength: 120
    postContactMessagePayload:
        type: object
        required:
