            - email
            - fullName
            - quantity
        properties:
            email:
                type: string
                format: email
                maxLength: 255
            fullName:
                type: string
                maxLength: 200
                minLength: 1
            quantity:
                type: integer
                maximum: 100
                minimum: 1
            tierId:
                type: string
                format: uuid4
    postForgotPasswordCompletePayload:
        type: object
        required:
            - token
            - password
        properties:
            password:
                description: New password to set for user
                type: string
                maxLength: 500
                minLength: 15
                example: correct horse battery staple
            token:
                description: Password reset token sent via email
                type: string
                format: uuid4
                example: ec16f032-3c44-4148-bbcc-45557466fa74
    postForgotPasswordPayload:
        type: object
        required:
            - username
        properties:
            username:
                description: Username to initiate password reset for
                type: string
                format: email
                maxLength: 255
                minLength: 1
                example: user@example.com
    postLoginPayload:
        type: object
        required:
            - username
            - password
        properties:
            password:
                description: Password of user to authenticate as
                type: string
                maxLength: 500
                minLength: 1
                example: correct horse battery staple
            username:
                description: Username of user to authenticate as
                type: string
                format: email
                maxLength: 255
                minLength: 1
                example: user@example.com
    postLoginResponse:
        type: object
        required:
            - access_token
            - token_type
            - expires_in
            - refresh_token
        properties:
            access_token:
                description: Access token required for accessing protected API endpoints
                type: string
                format: uuid4
                example: c1247d8d-0d65-41c4-bc86-ec041d2ac437
            expires_in:
                description: Access token expiry in seconds
                type: integer
                format: int64
                example: 86400
            refresh_token:
                description: Refresh token for refreshing the access token once it expires
                type: string
                format: uuid4
                example: 1dadb3bd-50d8-485d-83a3-6111392568f0
            token_type:
                description: Type of access token, will always be `bearer`
                type: string
                example: bearer
    postLogoutPayload:
        type: object
        properties:
            refresh_token:
                description: Optional refresh token to delete while logging out
                type: string
                format: uuid4
                example: 700ebed3-40f7-4211-bc83-a89b22b9875e
    postMediaPresignPayload:
        description: |-
            Declares an intended upload. Every field here is a CLAIM: a presigned PUT
            cannot constrain what the client actually sends, so these are used only for
            an early rejection and for reporting promised-versus-actual. The binding
            checks run at completion, against the stored object.
        type: object
        required:
            - filename
            - contentType
            - byteSize
        properties:
            byteSize:
                type: integer
                minimum: 1
                example: 204800
            contentType:
                type: string
                maxLength: 128
                example: image/jpeg
            filename:
                type: string
                maxLength: 255
                minLength: 1
                example: hero.jpg
    postMembershipApplicationPayload:
        type: object
        required:
            - email
            - fullName
        properties:
            email:
                type: string
                format: email
                maxLength: 255
            fullName:
                type: string
                maxLength: 200
                minLength: 1
            motivation:
                type: string
                maxLength: 2000
            organisation:
                type: string
                maxLength: 200
    postRefreshPayload:
        type: object
        required:
            - refresh_token
        properties:
            refresh_token:
                description: Refresh token to use for retrieving new token set
                type: string
                format: uuid4
                example: 7503cd8a-c921-4368-a32d-6c1d01d86da9
    postRegisterPayload:
        type: object
        required:
            - username
            - password
        properties:
            password:
                description: Password to register with
                type: string
                maxLength: 500
                minLength: 15
                example: correct horse battery staple
            username:
                description: Username to register with
                type: string
                format: email
                maxLength: 255
                minLength: 1
                example: user@example.com
    postResourcePayload:
        type: object
        required:
            - title
            - summary
            - kind
