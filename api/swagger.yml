        properties:
            newToken:
                description: New push token for given provider.
                type: string
                maxLength: 500
                example: 1c91e550-8167-439c-8021-dee7de2f7e96
            oldToken:
                description: Old token that can be deleted if present.
                type: string
                maxLength: 500
                x-nullable: true
                example: 495179de-b771-48f0-aab2-8d23701b0f02
            provider:
                description: Identifier of the provider the token is for (eg. "fcm", "apn"). Currently only "fcm" is supported.
                type: string
                maxLength: 500
                example: fcm
    registerResponse:
        type: object
        required:
            - requiresConfirmation
        properties:
            requiresConfirmation:
                description: Indicates whether the registration process requires email confirmation
                type: boolean
                example: true
    resourceDetail:
        type: object
        required:
            - id
            - slug
            - title
            - summary
            - body
            - kind
            - category
            - author
            - readingTimeMinutes
        properties:
            author:
                type: string
            body:
                type: string
            category:
                type: string
            contentURL:
                type: string
                x-nullable: true
            id:
                type: string
                format: uuid4
            image:
                type: string
                x-nullable: true
            kind:
                type: string
                enum:
                    - article
                    - guide
                    - video
                    - download
                    - link
            publishedAt:
                type: string
                format: date-time
                x-nullable: true
            readingTimeMinutes:
