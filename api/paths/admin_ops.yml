swagger: "2.0"
info:
  title: github.com/idowuseyi/cloudtecko-backend-go
  version: 0.1.0
paths:
  /api/v1/admin/orders:
    get:
      security:
        - Bearer: []
      description: Lists orders for fulfilment and review.
      tags:
        - admin
      summary: Lists orders
      operationId: GetAdminOrdersRoute
      parameters:
        - name: status
          in: query
          type: string
      responses:
        "200":
          description: The orders
          schema:
            "$ref": "../definitions/community.yml#/definitions/OrderList"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/admin/orders/{id}/{action}:
    post:
      security:
        - Bearer: []
      description: |-
        Advances an order along its fulfilment path: pack, ship, deliver or
        cancel.

        Each step is guarded against the states it may legally come from, so an
        order cannot skip a step by calling endpoints out of order, and two
        admins working from a stale list cannot both advance the same order.
        Cancelling restocks whatever the order was holding.
      tags:
        - admin
      summary: Advances an order
      operationId: PostAdminAdvanceOrderRoute
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid4
        - name: action
          in: path
          required: true
          type: string
          enum:
            - packed
            - shipped
            - delivered
            - cancelled
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostAdvanceOrderPayload"
      responses:
        "200":
          description: The order
          schema:
            "$ref": "../definitions/community.yml#/definitions/OrderSummary"
        "404":
          description: PublicHTTPError - no such order
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "409":
          description: PublicHTTPError - not a legal transition from the current state
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/admin/payments/{id}/refund:
    post:
      security:
        - Bearer: []
      description: |-
        Refunds a payment, in full or in part.

        The provider is called FIRST. Recording a refund we failed to make would
        say a customer was repaid when they were not, which is worse than the
        reverse -- if the local write fails after the provider succeeds, the
        refund webhook reconciles it.

        Restock is explicit, never inferred: whether goods came back is a human
        judgement.
      tags:
        - admin
      summary: Refunds a payment
      operationId: PostAdminRefundRoute
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid4
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostRefundPayload"
      responses:
        "200":
          description: The refund
          schema:
            "$ref": "../definitions/community.yml#/definitions/RefundResponse"
        "400":
          description: PublicHTTPError - the amount is not valid for this payment
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "404":
          description: PublicHTTPError - no such payment
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "409":
          description: PublicHTTPError - that payment is not refundable
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "502":
          description: PublicHTTPError - the provider refused; nothing was recorded
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/admin/webhook-events:
    get:
      security:
        - Bearer: []
      description: |-
        Lists provider events that were received but never processed.

        This is the operational alarm for "money taken, nothing recorded". An
        entry here means a provider told us about a payment and we failed to act
        on it; it should normally be empty.
      tags:
        - admin
      summary: Lists unprocessed webhook events
      operationId: GetAdminWebhookEventsRoute
      responses:
        "200":
          description: The unprocessed events
          schema:
            "$ref": "../definitions/community.yml#/definitions/WebhookEventList"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
