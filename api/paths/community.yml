swagger: "2.0"
info:
  title: github.com/idowuseyi/cloudtecko-backend-go
  version: 0.1.0
paths:
  /api/v1/contact-messages:
    post:
      description: |-
        Submits the contact form.

        Always returns 202, whether the message was stored or silently dropped by
        the per-sender throttle. Reporting "you submitted too recently" would
        confirm that an address has used the form.
      tags:
        - community
      summary: Submits a contact message
      operationId: PostContactMessageRoute
      parameters:
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostContactMessagePayload"
      responses:
        "202":
          description: Accepted
        "400":
          description: PublicHTTPError - validation failed
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/faqs:
    get:
      description: Lists published FAQs, optionally narrowed to one category.
      tags:
        - community
      summary: Lists published FAQs
      operationId: GetFAQsRoute
      parameters:
        - name: category
          in: query
          type: string
          maxLength: 80
      responses:
        "200":
          description: The FAQs
          schema:
            "$ref": "../definitions/community.yml#/definitions/FAQList"
  /api/v1/membership/applications:
    post:
      description: |-
        Applies to join the community.

        Always returns 202 -- for a new application, a duplicate, and a previously
        rejected address alike. The EMAIL that follows differs; the RESPONSE never
        does. Anything else would turn this endpoint into a membership-list
        oracle.
      tags:
        - community
      summary: Applies to join the community
      operationId: PostMembershipApplicationRoute
      parameters:
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostMembershipApplicationPayload"
      responses:
        "202":
          description: Accepted
        "400":
          description: PublicHTTPError - validation failed
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/membership/invitations/accept:
    post:
      description: |-
        Accepts an invitation by choosing a password, creating the account and
        returning a session.

        The invitation token travels in the BODY, never the path. A token in a
        URL is written to every access log between the client and this process,
        sent onward in the Referer header of any outbound link on the landing
        page, and kept in browser history -- none of which this service controls.

        A not-found, not-approved and expired invitation are reported
        identically, so the endpoint cannot be used to discover which invitations
        exist.
      tags:
        - community
      summary: Accepts a membership invitation
      operationId: PostAcceptInvitationRoute
      parameters:
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostAcceptInvitationPayload"
      responses:
        "200":
          description: The new session
          schema:
            "$ref": "../definitions/auth.yml#/definitions/PostLoginResponse"
        "400":
          description: PublicHTTPError - the password does not meet the policy
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "404":
          description: PublicHTTPError - the invitation is not valid
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "409":
          description: PublicHTTPError - an account already exists for that address
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/admin/applications:
    get:
      security:
        - Bearer: []
      description: Lists membership applications for review.
      tags:
        - admin
      summary: Lists membership applications
      operationId: GetAdminApplicationsRoute
      parameters:
        - name: status
          in: query
          type: string
          enum:
            - pending
            - approved
            - rejected
            - withdrawn
            - accepted
            - expired
      responses:
        "200":
          description: The applications
          schema:
            "$ref": "../definitions/community.yml#/definitions/MembershipApplicationList"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/admin/applications/{id}/approve:
    post:
      security:
        - Bearer: []
      description: |-
        Approves an application and mints a single-use invitation.

        No user account is created here. Only the HASH of the invitation token is
        stored; the applicant becomes a user by accepting the invitation with a
        password of their choosing.
      tags:
        - admin
      summary: Approves a membership application
      operationId: PostAdminApplicationApproveRoute
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid4
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostApplicationReviewPayload"
      responses:
        "200":
          description: The approved application
          schema:
            "$ref": "../definitions/community.yml#/definitions/MembershipApplication"
        "404":
          description: PublicHTTPError - no such application
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "409":
          description: PublicHTTPError - the application has already been reviewed
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /api/v1/admin/applications/{id}/reject:
    post:
      security:
        - Bearer: []
      description: Rejects an application. No account is created or touched.
      tags:
        - admin
      summary: Rejects a membership application
      operationId: PostAdminApplicationRejectRoute
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid4
        - name: Payload
          in: body
          schema:
            "$ref": "../definitions/community.yml#/definitions/PostApplicationReviewPayload"
      responses:
        "200":
          description: The rejected application
          schema:
            "$ref": "../definitions/community.yml#/definitions/MembershipApplication"
        "404":
          description: PublicHTTPError - no such application
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "409":
          description: PublicHTTPError - the application has already been reviewed
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "401":
          description: PublicHTTPError - not authenticated
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
        "403":
          description: PublicHTTPError, type `MISSING_SCOPES` - the admin scope is required
          schema:
            "$ref": "../definitions/errors.yml#/definitions/PublicHTTPError"
  /webhooks/payments:
    post:
      description: |-
        Receives payment-provider notifications.

        Authenticated by an HMAC over the RAW request body, not by a bearer
        token. Note the provider's signature carries no timestamp and no nonce,
        so there is no replay window: anyone who ever observes one valid delivery
        can replay it verbatim forever and it will still verify. Replay
        protection is entirely server-side, via a unique idempotency key plus
        guarded state transitions.

        Always answers 200 for an authentic event, including a duplicate and an
        event type not acted on -- a non-2xx makes the provider retry for up to
        72 hours.
      tags:
        - webhooks
      summary: Receives payment provider webhooks
      operationId: PostPaymentWebhookRoute
      responses:
        "200":
          description: Received
        "400":
          description: Malformed body
        "401":
          description: The signature did not verify
        "500":
          description: Recording failed; the provider should retry
