swagger: "2.0"
info:
  title: github.com/idowuseyi/cloudtecko-backend-go
  version: 0.1.0
paths: {}
definitions:
  PostContactMessagePayload:
    type: object
    required:
      - name
      - email
      - subject
      - message
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
      email:
        type: string
        format: email
        maxLength: 255
      subject:
        type: string
        enum:
          - general
          - support
          - partnership
      message:
        type: string
        minLength: 1
        maxLength: 5000
  FAQ:
    type: object
    required:
      - id
      - question
      - answer
      - category
    properties:
      id:
        type: string
        format: uuid4
      question:
        type: string
      answer:
        type: string
      category:
        type: string
  FAQList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/FAQ"
  PostMembershipApplicationPayload:
    type: object
    required:
      - email
      - fullName
    properties:
      email:
        type: string
        format: email
        maxLength: 255
      fullName:
        type: string
        minLength: 1
        maxLength: 200
      motivation:
        type: string
        maxLength: 2000
      organisation:
        type: string
        maxLength: 200
  MembershipApplication:
    type: object
    required:
      - id
      - email
      - fullName
      - motivation
      - status
      - createdAt
    properties:
      id:
        type: string
        format: uuid4
      email:
        type: string
        format: email
      fullName:
        type: string
      motivation:
        type: string
      organisation:
        type: string
        x-nullable: true
      status:
        type: string
        enum:
          - pending
          - approved
          - rejected
          - withdrawn
          - accepted
          - expired
      reviewNote:
        type: string
        x-nullable: true
      createdAt:
        type: string
        format: date-time
  MembershipApplicationList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/MembershipApplication"
  PostApplicationReviewPayload:
    type: object
    properties:
      note:
        type: string
        maxLength: 1000
  PostAcceptInvitationPayload:
    description: |-
      Accepts an invitation by choosing a password. The account is created HERE,
      not at approval time, so an unaccepted invitation leaves no orphan account
      and the link alone grants nothing.

      The token is a body field rather than a path segment because it is a bearer
      credential, and a credential in a URL leaks to logs, Referer headers and
      browser history.
    type: object
    required:
      - token
      - password
    properties:
      token:
        type: string
        format: uuid4
        example: 3a9c0f7e-1f1a-4d0e-9a1f-2b0c3d4e5f60
      password:
        type: string
        minLength: 15
        maxLength: 512
        example: a-sufficiently-long-passphrase
  DonationTier:
    type: object
    required:
      - id
      - name
      - amountKobo
    properties:
      id:
        type: string
        format: uuid4
      name:
        type: string
        example: Supporter
      description:
        type: string
      amountKobo:
        description: Amount in kobo. Never a decimal - money is integer minor units.
        type: integer
        example: 500000
      interval:
        description: Empty for a one-off suggestion; "monthly" or "annually" for recurring tiers.
        type: string
  DonationTierList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/DonationTier"
  PostDonationCheckoutPayload:
    type: object
    required:
      - email
      - amountKobo
    properties:
      email:
        type: string
        format: email
        maxLength: 255
      amountKobo:
        description: Amount in kobo, bounded server-side.
        type: integer
        minimum: 1
        example: 10000
      displayName:
        type: string
        maxLength: 200
        x-nullable: true
      isAnonymous:
        type: boolean
        default: false
  DonationCheckoutResponse:
    description: |-
      Where to send the payer, plus the token needed to read this donation's
      status afterwards. The token is shown ONCE: only its hash is stored.
    type: object
    required:
      - reference
      - authorizationUrl
      - accessToken
      - amountKobo
    properties:
      reference:
        type: string
        example: cld_don_K4M2P9XQ7RTVWZ3B
      authorizationUrl:
        description: Redirect the payer here.
        type: string
      accessToken:
        description: Send as the X-Donation-Token header when reading status. Shown once.
        type: string
      amountKobo:
        type: integer
  DonationStatusResponse:
    type: object
    required:
      - reference
      - status
      - amountKobo
      - currency
    properties:
      reference:
        type: string
      status:
        type: string
        enum:
          - pending
          - active
          - completed
          - past_due
          - cancelled
          - failed
      amountKobo:
        type: integer
      currency:
        type: string
  Donation:
    type: object
    required:
      - id
      - reference
      - status
      - amountKobo
      - currency
      - email
      - isAnonymous
      - createdAt
    properties:
      id:
        type: string
        format: uuid4
      reference:
        type: string
      status:
        type: string
      amountKobo:
        type: integer
      currency:
        type: string
      email:
        type: string
        format: email
      displayName:
        type: string
        x-nullable: true
      isAnonymous:
        type: boolean
      createdAt:
        type: string
        format: date-time
  DonationList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/Donation"
  TicketTier:
    type: object
    required:
      - id
      - name
      - priceKobo
      - currency
      - remaining
      - maxPerOrder
    properties:
      id:
        type: string
        format: uuid4
      name:
        type: string
        example: General Admission
      description:
        type: string
      priceKobo:
        description: Zero means a free RSVP tier. Free and paid tiers coexist on one event.
        type: integer
      currency:
        type: string
      remaining:
        description: Seats still available, after in-flight holds.
        type: integer
      maxPerOrder:
        description: Zero means unlimited per order.
        type: integer
  TicketTierList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/TicketTier"
  PostEventRegistrationPayload:
    type: object
    required:
      - tierId
      - email
      - fullName
      - quantity
    properties:
      tierId:
        type: string
        format: uuid4
      email:
        type: string
        format: email
        maxLength: 255
      fullName:
        type: string
        minLength: 1
        maxLength: 200
      quantity:
        type: integer
        minimum: 1
        maximum: 100
  EventRegistrationResponse:
    description: |-
      A free RSVP comes back confirmed, with no reference and nothing to pay. A
      paid registration comes back reserved, with somewhere to pay and a token
      for checking on it afterwards.
    type: object
    required:
      - ticketCode
      - status
      - amountKobo
    properties:
      ticketCode:
        type: string
        example: CLD-4H9KM-2P7QR
      status:
        type: string
        enum:
          - reserved
          - confirmed
          - cancelled
          - refunded
      amountKobo:
        type: integer
      reference:
        type: string
      authorizationUrl:
        description: Present for paid tiers only. Redirect the payer here.
        type: string
      accessToken:
        description: Present for paid tiers only. Shown once.
        type: string
  ProductVariant:
    type: object
    required:
      - id
      - sku
      - priceKobo
      - available
    properties:
      id:
        type: string
        format: uuid4
      sku:
        type: string
      size:
        type: string
        x-nullable: true
      colour:
        type: string
        x-nullable: true
      priceKobo:
        type: integer
      available:
        description: Stock left after in-flight holds. Never negative.
        type: integer
  Product:
    type: object
    required:
      - id
      - slug
      - title
      - variants
    properties:
      id:
        type: string
        format: uuid4
      slug:
        type: string
      title:
        type: string
      description:
        type: string
      image:
        type: string
        x-nullable: true
      variants:
        type: array
        items:
          "$ref": "#/definitions/ProductVariant"
  ProductList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/Product"
  CartLine:
    description: An id and a count. Prices are never accepted from the client.
    type: object
    required:
      - variantId
      - quantity
    properties:
      variantId:
        type: string
        format: uuid4
      quantity:
        type: integer
        minimum: 1
        maximum: 100
  PostCheckoutPayload:
    type: object
    required:
      - lines
      - email
      - fullName
      - shippingState
    properties:
      lines:
        # Bounded because checkout holds one pooled connection and takes a row
        # lock per line for the whole transaction. Unbounded, an anonymous caller
        # could send thousands of lines and exhaust a pool of ten connections
        # with a single request. Fifty is far beyond any real cart.
        type: array
        minItems: 1
        maxItems: 50
        items:
          "$ref": "#/definitions/CartLine"
      email:
        type: string
        format: email
        maxLength: 255
      fullName:
        type: string
        minLength: 1
        maxLength: 200
      phone:
        type: string
        maxLength: 32
        x-nullable: true
      shippingLine1:
        type: string
        maxLength: 200
        x-nullable: true
      shippingLine2:
        type: string
        maxLength: 200
        x-nullable: true
      shippingCity:
        type: string
        maxLength: 120
        x-nullable: true
      shippingState:
        type: string
        maxLength: 120
      shippingCountry:
        type: string
        maxLength: 120
        x-nullable: true
      shippingPostcode:
        type: string
        maxLength: 32
        x-nullable: true
  CartProblem:
    description: One cart line that could not be fulfilled, so the client can say which.
    type: object
    required:
      - variantId
      - reason
      - available
    properties:
      variantId:
        type: string
        format: uuid4
      reason:
        type: string
        enum:
          - unavailable
          - out_of_stock
      available:
        type: integer
  CheckoutResponse:
    type: object
    required:
      - reference
      - authorizationUrl
      - accessToken
      - subtotalKobo
      - shippingKobo
      - taxKobo
      - totalKobo
    properties:
      reference:
        type: string
      authorizationUrl:
        type: string
      accessToken:
        description: Shown once. Send as X-Order-Token when reading order status.
        type: string
      subtotalKobo:
        type: integer
      shippingKobo:
        type: integer
      taxKobo:
        description: Added on top of goods and shipping. Zero unless a VAT rate is configured.
        type: integer
      totalKobo:
        type: integer
  CheckoutConflictResponse:
    description: |-
      A 409 from checkout, carrying per-line detail.

      PublicHTTPError's `detail` is a plain string, which cannot say WHICH cart
      line failed. A client that only learns "something is unavailable" has to
      make the customer re-check a whole basket by hand, so this response keeps
      the standard error envelope and adds a machine-readable list.
    type: object
    required:
      - status
      - type
      - title
      - problems
    properties:
      status:
        type: integer
        format: int64
        example: 409
      type:
        "$ref": "../definitions/errors.yml#/definitions/PublicHTTPErrorType"
      title:
        type: string
      problems:
        type: array
        items:
          "$ref": "#/definitions/CartProblem"
  PostRecurringDonationPayload:
    description: |-
      There is no amount here on purpose: it comes from the tier. The provider
      fixes an amount to a Plan, so accepting one from the client would silently
      disagree with what is actually charged.
    type: object
    required:
      - tierId
      - email
    properties:
      tierId:
        type: string
        format: uuid4
      email:
        type: string
        format: email
        maxLength: 255
      displayName:
        type: string
        maxLength: 200
        x-nullable: true
      isAnonymous:
        type: boolean
        default: false
  OrderSummary:
    type: object
    required:
      - id
      - reference
      - status
      - totalKobo
      - email
      - createdAt
    properties:
      id:
        type: string
        format: uuid4
      reference:
        type: string
      status:
        type: string
      totalKobo:
        type: integer
      email:
        type: string
        format: email
      createdAt:
        type: string
        format: date-time
  OrderList:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/OrderSummary"
  PostAdvanceOrderPayload:
    type: object
    properties:
      trackingReference:
        type: string
        maxLength: 120
        x-nullable: true
  PostRefundPayload:
    type: object
    properties:
      amountKobo:
        description: Omit or send 0 to refund the full remaining amount.
        type: integer
        minimum: 0
      reason:
        type: string
        maxLength: 500
      restock:
        description: Whether to return stock. A human decision - a refund does not imply goods came back.
        type: boolean
        default: false
  RefundResponse:
    type: object
    required:
      - paymentId
      - amountKobo
      - totalRefundedKobo
      - status
    properties:
      paymentId:
        type: string
        format: uuid4
      amountKobo:
        type: integer
      totalRefundedKobo:
        type: integer
      status:
        type: string
  WebhookEventSummary:
    type: object
    required:
      - id
      - provider
      - eventType
      - receivedAt
      - attempts
    properties:
      id:
        type: string
        format: uuid4
      provider:
        type: string
      eventType:
        type: string
      providerReference:
        type: string
        x-nullable: true
      receivedAt:
        type: string
        format: date-time
      attempts:
        type: integer
  WebhookEventList:
    description: Unprocessed provider events - the alarm for "money taken, nothing recorded".
    type: object
    required:
      - items
    properties:
      items:
        type: array
        items:
          "$ref": "#/definitions/WebhookEventSummary"
